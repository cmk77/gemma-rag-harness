# main 푸시마다 데모 이미지를 GHCR에 빌드·푸시한다.
# 결과: ghcr.io/cmk77/gemma-rag-harness (앱) / ghcr.io/cmk77/gemma-rag-harness-es (ES+nori)
# 저장소 페이지 우측 Packages에 노출 — 리뷰어는 docker compose up 만으로 실행 가능.
name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push ES(nori) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.es
          push: true
          tags: ghcr.io/${{ github.repository }}-es:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
